name: Fix Hauling QR images

on:
  push:
    branches: [main]
    paths:
      - ".hauling-upload/**"
      - ".github/workflows/fix-hauling-images.yml"

permissions:
  contents: write

jobs:
  fix-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace wrappers with real images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          root = Path("screenshots/hauling-qr")
          replacements = {}

          for filename in (
              "01-active-trip-scanner.svg",
              "02-location-selector.svg",
              "03-recent-trip-history.svg",
              "04-backend-url-configuration.svg",
          ):
              source = root / filename
              match = re.search(
                  r'data:image/([^;]+);base64,([^\"]+)',
                  source.read_text(encoding="utf-8"),
              )
              if not match:
                  raise RuntimeError(f"No embedded image found in {source}")

              mime = match.group(1).lower()
              extension = {
                  "jpeg": "jpg",
                  "jpg": "jpg",
                  "webp": "webp",
                  "png": "png",
                  "avif": "avif",
              }.get(mime, mime)
              output = root / f"{source.stem}.{extension}"
              output.write_bytes(base64.b64decode(match.group(2)))
              replacements[filename] = output.name

          uploads = {
              "05-staff-login.svg": (
                  "05-staff-login.avif",
                  [".hauling-upload/05.part0", ".hauling-upload/05.part1"],
              ),
              "06-driver-information.svg": (
                  "06-driver-information.avif",
                  [".hauling-upload/06.part0", ".hauling-upload/06.part1"],
              ),
              "07-driver-truck-qr-scanner.svg": (
                  "07-driver-truck-qr-scanner.avif",
                  [".hauling-upload/07.part0", ".hauling-upload/07.part1"],
              ),
          }

          for old_name, (new_name, parts) in uploads.items():
              encoded = "".join(Path(part).read_text(encoding="utf-8") for part in parts)
              (root / new_name).write_bytes(base64.b64decode(encoded))
              replacements[old_name] = new_name

          page = Path("hauling-qr-proof.html")
          html = page.read_text(encoding="utf-8")
          for old_name, new_name in replacements.items():
              html = html.replace(old_name, new_name)
          html = html.replace("object-fit:cover;object-position:top", "object-fit:contain;object-position:center")
          page.write_text(html, encoding="utf-8")

          for svg in root.glob("*.svg"):
              svg.unlink()

          upload_dir = Path(".hauling-upload")
          if upload_dir.exists():
              for item in upload_dir.iterdir():
                  item.unlink()
              upload_dir.rmdir()

          workflow = Path(".github/workflows/fix-hauling-images.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit real image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Hauling QR SVG wrappers with real image files"
          git push
